<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Медовая пасека</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#75d7ff, #b9ec82);
  overflow: hidden;
}

.game {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  margin: auto;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, white 0 3px, transparent 4px),
    linear-gradient(#75d7ff 0 35%, #8bd34f 35% 100%);
}

/* Верх */
.top {
  position: absolute;
  top: 15px;
  left: 12px;
  right: 12px;
  background: #75451f;
  border: 4px solid #4e2d16;
  border-radius: 20px;
  padding: 12px;
  color: white;
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  z-index: 10;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 8px;
  background: #fff3c4;
  color: #633c18;
  border-radius: 14px;
  padding: 8px;
  font-size: 17px;
}

/* Пчёлы */
.bee {
  position: absolute;
  font-size: 48px;
  animation: fly 4s infinite alternate ease-in-out;
}

.bee1 {
  top: 190px;
  left: 40px;
}

.bee2 {
  top: 270px;
  right: 45px;
  animation-delay: 1s;
}

.bee3 {
  top: 370px;
  left: 180px;
  animation-delay: 2s;
}

@keyframes fly {
  from {
    transform: translate(0,0) rotate(-5deg);
  }
  to {
    transform: translate(45px,-25px) rotate(5deg);
  }
}

/* Ульи */
.hives {
  position: absolute;
  bottom: 190px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
}

.hive {
  width: 115px;
  height: 125px;
  background: linear-gradient(#c88735, #8c4d20);
  border: 5px solid #603616;
  border-radius: 18px 18px 30px 30px;
  position: relative;
  box-shadow: 0 8px 0 #573216;
}

.hive:before,
.hive:after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  height: 18px;
  background: #e8a94d;
  border: 3px solid #71401c;
  border-radius: 10px;
}

.hive:before {
  top: 30px;
}

.hive:after {
  top: 65px;
}

.hiveDoor {
  position: absolute;
  bottom: 8px;
  left: 43px;
  width: 25px;
  height: 18px;
  background: #4d2815;
  border-radius: 50% 50% 0 0;
}

/* Банки */
.jar {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: 145px;
  height: 135px;
  background: rgba(255,255,255,.45);
  border: 5px solid #dff8ff;
  border-radius: 25px 25px 35px 35px;
  box-shadow: inset 0 0 15px white;
  text-align: center;
  padding-top: 15px;
}

.jarLid {
  width: 115px;
  height: 20px;
  background: #8b5a2b;
  border-radius: 10px;
  margin: -28px auto 15px;
}

.honey {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 45%;
  background: #f4b51b;
  border-radius: 0 0 28px 28px;
  opacity: .9;
}

.jarText {
  position: relative;
  z-index: 2;
  font-size: 20px;
  font-weight: bold;
  color: #6a3b12;
}

/* Кнопка */
.collect {
  position: absolute;
  bottom: 165px;
  left: 50%;
  transform: translateX(-50%);
  width: 230px;
  padding: 14px;
  border: 0;
  border-radius: 25px;
  background: linear-gradient(#ffd84d, #e89b13);
  border: 4px solid #9a5a12;
  color: white;
  font-size: 20px;
  font-weight: bold;
  z-index: 5;
}

.collect:active {
  transform: translateX(-50%) scale(.95);
}
</style>
</head>

<body>

<div class="game">

  <div class="top">
    🐝 МЕДОВАЯ ПАСЕКА

    <div class="stats">
      <span>🍯 Мёд: <b id="honeyCount">0</b></span>
      <span>🫙 Банки: <b id="jars">0</b></span>
    </div>
  </div>

  <div class="bee bee1">🐝</div>
  <div class="bee bee2">🐝</div>
  <div class="bee bee3">🐝</div>

  <div class="hives">

    <div class="hive">
      <div class="hiveDoor"></div>
    </div>

    <div class="hive">
      <div class="hiveDoor"></div>
    </div>

    <div class="hive">
      <div class="hiveDoor"></div>
    </div>

  </div>

  <button class="collect" onclick="collectHoney()">
    🍯 СОБРАТЬ МЁД
  </button>

  <div class="jar">

    <div class="jarLid"></div>

    <div class="honey"></div>

    <div class="jarText">
      🫙<br>
      БАНКА МЁДА
    </div>

  </div>

</div>

<script>

let honey = 0;
let jars = 0;

function collectHoney() {

  honey += 10;

  if (honey >= 100) {
    honey -= 100;
    jars++;
  }

  document.getElementById("honeyCount").textContent = honey;
  document.getElementById("jars").textContent = jars;
}

</script>

</body>
      </html>
