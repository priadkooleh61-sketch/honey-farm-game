<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Медовая пасека</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #162b1d;
}

.game {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 15% 20%, #ffffffaa 0 3px, transparent 4px),
    radial-gradient(circle at 75% 15%, #ffffff99 0 4px, transparent 5px),
    linear-gradient(#79d8ff 0 43%, #78c94b 43% 100%);
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

.top {
  padding: 10px;
  background: linear-gradient(#70411e, #4d2b15);
  border-bottom: 4px solid #321b0d;
  color: white;
  position: relative;
  z-index: 20;
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 8px;
}

.currency {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}

.money {
  background: #fff0bd;
  color: #4b2b13;
  border-radius: 13px;
  padding: 8px 4px;
  text-align: center;
  font-weight: bold;
  border: 2px solid #c58c38;
}

/* ПАСЕКА */

.apiary {
  height: 520px;
  position: relative;
  overflow: hidden;
}

/* Цветы */

.flower {
  position: absolute;
  font-size: 25px;
}

.f1 { left: 25px; top: 150px; }
.f2 { left: 110px; top: 235px; }
.f3 { right: 30px; top: 170px; }
.f4 { right: 130px; top: 270px; }
.f5 { left: 200px; top: 145px; }
.f6 { left: 35px; bottom: 45px; }
.f7 { right: 35px; bottom: 45px; }

/* УЛЬИ */

.hives {
  position: absolute;
  left: 15px;
  right: 15px;
  bottom: 45px;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
}

.hive {
  width: 105px;
  height: 120px;
  position: relative;
  background: linear-gradient(#d99742, #9d5726);
  border: 5px solid #5b3318;
  border-radius: 18px 18px 28px 28px;
  box-shadow: 0 8px 0 #4b2a16;
}

.hive::before,
.hive::after {
  content: "";
  position: absolute;
  left: 9px;
  right: 9px;
  height: 17px;
  background: #edb452;
  border: 3px solid #70401c;
  border-radius: 10px;
}

.hive::before {
  top: 27px;
}

.hive::after {
  top: 58px;
}

.hive-door {
  position: absolute;
  width: 26px;
  height: 17px;
  left: 35px;
  bottom: 8px;
  background: #43230f;
  border-radius: 50% 50% 0 0;
}

/* БАНКИ */

.jars {
  position: absolute;
  left: 50%;
  top: 245px;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
}

.jar {
  width: 85px;
  height: 115px;
  position: relative;
  background: #ffffff55;
  border: 4px solid #e8faff;
  border-radius: 17px 17px 25px 25px;
  overflow: hidden;
  box-shadow: inset 0 0 12px #fff;
}

.lid {
  position: absolute;
  left: 7px;
  top: -9px;
  width: 63px;
  height: 18px;
  background: #81532c;
  border-radius: 10px;
}

.honey-fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0%;
  background: linear-gradient(#ffd52f, #e99b12);
  transition: height .4s;
}

.jar-label {
  position: absolute;
  z-index: 3;
  top: 43px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  color: #6a3b13;
}

/* ПЧЁЛЫ */

.bee {
  position: absolute;
  font-size: 42px;
  z-index: 15;
  pointer-events: none;
}

.bee.fly {
  animation: beeFly 2.5s ease-in-out forwards;
}

@keyframes beeFly {
  0% {
    transform: translate(0,0) rotate(-5deg);
  }

  25% {
    transform: translate(80px,-40px) rotate(8deg);
  }

  50% {
    transform: translate(150px,20px) rotate(-4deg);
  }

  75% {
    transform: translate(90px,60px) rotate(5deg);
  }

  100% {
    transform: translate(0,0) rotate(0);
  }
}

/* ПАНЕЛЬ ПЧЁЛ */

.bees-panel {
  position: absolute;
  top: 95px;
  left: 10px;
  right: 10px;
  background: #fff0bd;
  border: 3px solid #9b6829;
  border-radius: 17px;
  padding: 8px;
  z-index: 18;
}

.bees-title {
  text-align: center;
  font-weight: bold;
  color: #5b3516;
  margin-bottom: 6px;
}

.bee-list {
  display: flex;
  gap: 7px;
  overflow-x: auto;
}

.bee-card {
  min-width: 105px;
  background: #fff9df;
  border: 2px solid #d39a3b;
  border-radius: 12px;
  padding: 6px;
  text-align: center;
  color: #553215;
}

.bee-icon {
  font-size: 30px;
}

.bee-level {
  font-size: 13px;
  font-weight: bold;
}

.upgrade {
  border: 0;
  margin-top: 5px;
  background: #6cae36;
  color: white;
  border-radius: 8px;
  padding: 5px 7px;
  font-weight: bold;
}

/* КНОПКИ */

.controls {
  background: #fff0bd;
  border-top: 5px solid #613717;
  padding: 12px;
}

button.main {
  width: 100%;
  border: 0;
  padding: 13px;
  margin-top: 7px;
  border-radius: 14px;
  background: linear-gradient(#ffd84e, #e8a016);
  border: 3px solid #9a5c12;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button.main:active {
  transform: scale(.97);
}

.message {
  text-align: center;
  min-height: 25px;
  margin-top: 7px;
  font-weight: bold;
  color: #563415;
}

/* ВСПЛЫВАЮЩИЙ ТЕКСТ */

.pop {
  position: fixed;
  color: #fff;
  font-weight: bold;
  font-size: 23px;
  z-index: 100;
  pointer-events: none;
  animation: pop 1s forwards;
}

@keyframes pop {
  from {
    opacity: 1;
    transform: translateY(0);
  }

  to {
    opacity: 0;
    transform: translateY(-70px);
  }
}

@media(max-width:420px) {
  .hive {
    width: 88px;
    height: 105px;
  }

  .jars {
    top: 255px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="top">

    <div class="title">
      🐝 МЕДОВАЯ ПАСЕКА
    </div>

    <div class="currency">
      <div class="money">
        🥇 Золото
        <br>
        <span id="gold">100</span>
      </div>

      <div class="money">
        🥈 Серебро
        <br>
        <span id="silver">0</span>
      </div>

      <div class="money">
        🍯 Мёд
        <br>
        <span id="honey">0</span>/100
      </div>
    </div>

  </div>

  <div class="apiary">

    <div class="flower f1">🌻</div>
    <div class="flower f2">🌼</div>
    <div class="flower f3">🌻</div>
    <div class="flower f4">🌷</div>
    <div class="flower f5">🌼</div>
    <div class="flower f6">🌻</div>
    <div class="flower f7">🌼</div>

    <!-- ПАНЕЛЬ ПЧЁЛ -->

    <div class="bees-panel">

      <div class="bees-title">
        🐝 Мои пчёлы
      </div>

      <div class="bee-list" id="beeList"></div>

    </div>

    <!-- БАНКИ -->

    <div class="jars">

      <div class="jar">
        <div class="lid"></div>
        <div class="honey-fill" id="jar1"></div>
        <div class="jar-label">🫙 Банка</div>
      </div>

      <div class="jar">
        <div class="lid"></div>
        <div class="honey-fill" id="jar2"></div>
        <div class="jar-label">🫙 Банка</div>
      </div>

      <div class="jar">
        <div class="lid"></div>
        <div class="honey-fill" id="jar3"></div>
        <div class="jar-label">🫙 Банка</div>
      </div>

    </div>

    <!-- УЛЬИ -->

    <div class="hives">

      <div class="hive">
        <div class="hive-door"></div>
      </div>

      <div class="hive">
        <div class="hive-door"></div>
      </div>

      <div class="hive">
        <div class="hive-door"></div>
      </div>

    </div>

    <div id="flyingBees"></div>

  </div>

  <div class="controls">

    <button class="main" onclick="buyBee()">
      🐝 Купить пчелу — 100 🥇
    </button>

    <button class="main" onclick="sellHoney()">
      🫙 Продать мёд
    </button>

    <div class="message" id="message">
      Купи первую пчелу за 100 золота!
    </div>

  </div>

</div>

<script>

let gold = 100;
let silver = 0;
let honey = 0;

let bees = [];

let beeId = 0;

/* Показать данные */

function update() {

  document.getElementById("gold").textContent = gold;
  document.getElementById("silver").textContent = silver;
  document.getElementById("honey").textContent = honey;

  updateBeePanel();
  updateJars();
}

/* ПАНЕЛЬ ПЧЁЛ */

function updateBeePanel() {

  const list = document.getElementById("beeList");

  list.innerHTML = "";

  bees.forEach(bee => {

    const card = document.createElement("div");

    card.className = "bee-card";

    card.innerHTML = `
      <div class="bee-icon">🐝</div>
      <div>Пчела №${bee.id}</div>
      <div class="bee-level">
        ⭐ Уровень ${bee.level}
      </div>
      <div>
        🍯 +${bee.speed}/цикл
      </div>
      <button class="upgrade"
        onclick="upgradeBee(${bee.id})">
        ⬆️ Улучшить
      </button>
    `;

    list.appendChild(card);

  });

}

/* КУПИТЬ ПЧЕЛУ */

function buyBee() {

  if (gold < 100) {

    showMessage("❌ Нужно 100 золота!");

    return;
  }

  gold -= 100;

  beeId++;

  bees.push({
    id: beeId,
    level: 1,
    speed: 2
  });

  showMessage("🐝 Новая пчела появилась!");

  update();

}

/* УЛУЧШЕНИЕ */

function upgradeBee(id) {

  const bee = bees.find(b => b.id === id);

  if (!bee) return;

  const priceGold = bee.level * 50;
  const priceSilver = bee.level * 2;

  if (
    gold < priceGold ||
    silver < priceSilver
  ) {

    showMessage(
      "❌ Нужно " +
      priceGold +
      " 🥇 и " +
      priceSilver +
      " 🥈"
    );

    return;
  }

  gold -= priceGold;
  silver -= priceSilver;

  bee.level++;

  bee.speed += 2;

  showMessage(
    "⭐ Пчела стала " +
    bee.level +
    " уровня!"
  );

  update();

}

/* ПРОИЗВОДСТВО */

function produceHoney() {

  if (bees.length === 0) return;

  bees.forEach(bee => {

    honey += bee.speed;

    if (honey > 100) {
      honey = 100;
    }

    animateBee();

  });

  update();

}

/* ПЧЕЛА ЛЕТИТ */

function animateBee() {

  const bee = document.createElement("div");

  bee.className = "bee fly";

  bee.textContent = "🐝";

  bee.style.left =
    (100 + Math.random() * 250) + "px";

  bee.style.top =
    (160 + Math.random() * 100) + "px";

  document.getElementById("flyingBees")
    .appendChild(bee);

  setTimeout(() => {

    bee.remove();

  }, 2500);

}

/* БАНКИ */

function updateJars() {

  const percent = honey;

  document.getElementById("jar1")
    .style.height = percent + "%";

  document.getElementById("jar2")
    .style.height =
      Math.max(0, percent - 33) * 1.5 + "%";

  document.getElementById("jar3")
    .style.height =
      Math.max(0, percent - 66) * 3 + "%";
}

/* ПРОДАЖА */

function sellHoney() {

  if (honey < 100) {

    showMessage(
      "🫙 Банка ещё не заполнена!"
    );

    return;
  }

  honey = 0;

  gold += 50;

  silver += 1;

  showMessage(
    "💰 Мёд продан! +50 🥇 +1 🥈"
  );

  update();

}

/* СООБЩЕНИЕ */

function showMessage(text) {

  document.getElementById("message")
    .textContent = text;

}

/* АВТОМАТИЧЕСКОЕ ПРОИЗВОДСТВО */

setInterval(() => {

  produceHoney();

}, 3000);

update();

</script>

</body>
  </html>
