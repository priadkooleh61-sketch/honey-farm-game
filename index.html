Олег Прядко <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honey Valley</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#17120d;
  font-family:Arial,sans-serif;
  color:#fff;
}
button{font-family:inherit;cursor:pointer}
.game{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#ead08a;
  overflow:hidden;
}

/* TOP */
.top{
  background:linear-gradient(#56351e,#2c1a0e);
  padding:10px;
  border-bottom:3px solid #170d07;
}
.title{
  text-align:center;
  font-size:23px;
  font-weight:900;
  color:#ffd85a;
  margin-bottom:9px;
}
.money{
  display:flex;
  gap:7px;
}
.moneyBox{
  flex:1;
  background:linear-gradient(#35485b,#202d3b);
  border:2px solid #98702e;
  border-radius:12px;
  padding:7px;
  text-align:center;
}
.moneyBox small{display:block;color:#bfc8d2;font-size:10px}
.moneyBox b{font-size:18px}

/* PAGE */
.page{
  min-height:650px;
  padding:12px;
  background:
    radial-gradient(circle at 20% 10%,#fff8 0 2px,transparent 3px),
    linear-gradient(#fff0bb,#e8c76f);
  color:#392514;
}
.pageTitle{
  background:linear-gradient(#70421e,#442713);
  color:#ffd75b;
  border:3px solid #a66d2d;
  border-radius:15px;
  padding:10px;
  text-align:center;
  font-size:21px;
  font-weight:900;
  margin-bottom:12px;
  box-shadow:0 4px 0 #43230f;
}

/* CARDS */
.card{
  background:linear-gradient(145deg,#fff5ce,#efd17c);
  border:2px solid #b77b2c;
  border-radius:14px;
  padding:10px;
  margin-bottom:9px;
  color:#432813;
  box-shadow:0 3px 7px #59320b44;
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon{
  width:60px;height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff2ad;
  border-radius:12px;
  font-size:39px;
  border:2px solid #c28a32;
}
.info{flex:1}
.name{font-weight:900;font-size:15px}
.sub{font-size:12px;color:#79552d;margin-top:4px}
.btn{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  font-weight:900;
  background:linear-gradient(#73c442,#4a9527);
  color:white;
}
.price{
  margin-top:5px;
  color:#9b650d;
  font-weight:900;
}

/* APIARY */
.apiary{
  height:400px;
  border-radius:17px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(#74cbe8 0 43%,#76b947 43%);
  border:3px solid #70431f;
}
.sun{
  position:absolute;
  right:25px;top:22px;
  width:55px;height:55px;
  border-radius:50%;
  background:#ffe477;
}
.mountain{
  position:absolute;
  bottom:135px;
  width:0;height:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:130px solid #79aeb1;
}
.m1{left:-50px}
.m2{right:-50px}
.hive{
  position:absolute;
  bottom:70px;
  width:90px;
  height:105px;
  background:repeating-linear-gradient(
    #d99034 0 17px,#a95e22 17px 21px
  );
  border:4px solid #603617;
  border-radius:10px;
}
.h1{left:25px}
.h2{left:50%;transform:translateX(-50%)}
.h3{right:25px}
.hive:after{
  content:"";
  position:absolute;
  bottom:7px;
  left:32px;
  width:23px;height:17px;
  background:#32180b;
  border-radius:50% 50% 4px 4px;
}
.bee{
  position:absolute;
  font-size:34px;
  z-index:5;
}
.b1{left:70px;top:130px;animation:b1 4s infinite}
.b2{left:220px;top:110px;animation:b2 4.5s infinite}
.b3{right:65px;top:155px;animation:b3 5s infinite}
@keyframes b1{
  50%{transform:translate(120px,60px) rotate(10deg)}
}
@keyframes b2{
  50%{transform:translate(-100px,80px) rotate(-10deg)}
}
@keyframes b3{
  50%{transform:translate(-120px,-45px) rotate(8deg)}
}

/* HONEY */
.jars{
  display:flex;
  gap:10px;
  justify-content:center;
}
.jar{
  width:85px;
  height:125px;
  border:4px solid #fff;
  border-radius:15px;
  background:#ffffff66;
  position:relative;
  overflow:hidden;
}
.fill{
  position:absolute;
  bottom:0;left:0;right:0;
  height:0;
  background:linear-gradient(#ffd83e,#e99b0f);
  transition:.5s;
}
.jarText{
  position:absolute;
  z-index:2;
  width:100%;
  top:50px;
  text-align:center;
  color:#71430f;
  font-weight:900;
}

/* SHOP */
.shop{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.shop .card{text-align:center}
.shop .big{font-size:48px}

/* BOOK */
.book{
  min-height:500px;
  border:10px solid #70401d;
  border-radius:15px;
  background:#fff0bc;
  padding:35px 20px;
  text-align:center;
  box-shadow:inset 0 0 20px #b77b2c;
}
.book h1{
  color:#9a5d18;
  font-size:28px;
  margin-top:80px;
}
.book p{
  margin-top:20px;
  line-height:1.6;
  color:#6a4723;
}
.bookBee{
  font-size:70px;
  margin-top:35px;
}

/* NAV */
.nav{
  position:sticky;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:linear-gradient(#54321c,#29170c);
  border-top:3px solid #9c6729;
  padding:6px;
}
.nav button{
  border:0;
  background:transparent;
  color:#c9b99d;
  padding:7px 2px;
  font-size:11px;
  font-weight:900;
}
.nav button span{
  display:block;
  font-size:23px;
}
.nav button.active{
  color:#ffd34e;
  background:#70441f;
  border-radius:10px;
}
.message{
  text-align:center;
  color:#633f1c;
  font-weight:bold;
  min-height:20px;
  margin-top:7px;
}
</style>
</head>

<body>

<div class="game">

<header class="top">
  <div class="title">🍯 HONEY VALLEY</div>

  <div class="money">
    <div class="moneyBox">
      <small>ЗОЛОТО</small>
      🥇 <b id="gold">200</b>
    </div>
    <div class="moneyBox">
      <small>СЕРЕБРО</small>
      🥈 <b id="silver">10</b>
    </div>
    <div class="moneyBox">
      <small>МЁД</small>
      🍯 <b id="honey">0</b>/100
    </div>
  </div>
</header>

<main class="page" id="page"></main>

<nav class="nav">
  <button onclick="openPage('bees')" id="nav-bees">
    <span>🐝</span>Пчёлы
  </button>

  <button onclick="openPage('hives')" id="nav-hives">
    <span>🏠</span>Ульи
  </button>

  <button onclick="openPage('honey')" id="nav-honey">
    <span>🫙</span>Мёд
  </button>

  <button onclick="openPage('shop')" id="nav-shop">
    <span>🏪</span>Магазин
  </button>

  <button onclick="openPage('apiary')" id="nav-apiary">
    <span>🌳</span>Пасека
  </button>
</nav>

</div>

<script>

let gold=200;
let silver=10;
let honey=0;

let bees=[
  {name:"Рабочая пчела",level:1,power:2}
];

let hives=[
  {name:"Деревянный улей",level:1,power:5},
  {name:"Цветочный улей",level:1,power:8}
];

let currentPage="bees";


function updateMoney(){
  document.getElementById("gold").textContent=gold;
  document.getElementById("silver").textContent=silver;
  document.getElementById("honey").textContent=honey;
}


function openPage(page){
  currentPage=page;

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById("nav-"+page)
    .classList.add("active");

  render();
}


function render(){

  const p=document.getElementById("page");

  if(currentPage==="bees"){

    p.innerHTML=`
      <div class="pageTitle">🐝 ТВОИ ПЧЁЛЫ</div>

      ${bees.map((b,i)=>`
        <div class="card">
          <div class="row">
            <div class="icon">🐝</div>

            <div class="info">
              <div class="name">${b.name}</div>
              <div class="sub">
                Уровень ${b.level}
              </div>
              <div class="sub">
                🍯 +${b.power} мёда за цикл
              </div>
            </div>

            <button class="btn"
              onclick="upgradeBee(${i})">
              Улучшить
            </button>
          </div>

          <div class="price">
            Стоимость: ${b.level*50} 🥇
          </div>
        </div>
      `).join("")}

      <div class="card">
        <div class="row">
          <div class="icon">🐝</div>
          <div class="info">
            <div class="name">Новая пчела</div>
            <div class="sub">Добавит производство мёда</div>
          </div>

          <button class="btn" onclick="buyBee()">
            Купить
          </button>
        </div>

        <div class="price">100 🥇</div>
      </div>

      <div class="message" id="message"></div>
    `;

  }


  if(currentPage==="hives"){

    p.innerHTML=`
      <div class="pageTitle">🏠 ТВОИ УЛЬИ</div>

      ${hives.map((h,i)=>`
        <div class="card">

          <div class="row">

            <div class="icon">🏠</div>

            <div class="info">
              <div class="name">${h.name}</div>
              <div class="sub">Уровень ${h.level}</div>
              <div class="sub">
                +${h.power} к производству
              </div>
            </div>

            <button class="btn"
              onclick="upgradeHive(${i})">
              Улучшить
            </button>

          </div>

          <div class="price">
            ${h.level*150} 🥇
          </div>

        </div>
      `).join("")}
    `;

  }


  if(currentPage==="honey"){

    p.innerHTML=`
      <div class="pageTitle">🫙 ТВОЙ МЁД</div>

      <div class="card">
        <div class="jars">

          <div class="jar">
            <div class="fill" style="height:${honey}%"></div>
            <div class="jarText">Банка 1</div>
          </div>

          <div class="jar">
            <div class="fill" style="height:${Math.max(0,honey-33)*1.5}%"></div>
            <div class="jarText">Банка 2</div>
          </div>

          <div class="jar">
            <div class="fill" style="height:${Math.max(0,honey-66)*3}%"></div>
            <div class="jarText">Банка 3</div>
          </div>

        </div>
      </div>

      <div class="card">
        <div class="name">🍯 Продажа мёда</div>

        <div class="sub">
          Полная банка приносит:
          <b>+50 🥇 +5 🥈</b>
        </div>

        <br>

        <button class="btn"
          onclick="sellHoney()">
          Продать мёд
        </button>

      </div>
    `;

  }


  if(currentPage==="shop"){

    p.innerHTML=`
      <div class="pageTitle">🏪 МАГАЗИН</div>

      <div class="shop">

        <div class="card">
          <div class="big">🐝</div>
          <div class="name">Пчела</div>
          <div class="price">100 🥇</div>
          <button class="btn" onclick="buyBee()">Купить</button>
        </div>

        <div class="card">
          <div class="big">🏠</div>
          <div class="name">Улей</div>
          <div class="price">300 🥇</div>
          <button class="btn" onclick="buyHive()">Купить</button>
        </div>

        <div class="card">
          <div class="big">🫙</div>
          <div class="name">Большая банка</div>
          <div class="price">200 🥇</div>
          <button class="btn">Купить</button>
        </div>

        <div class="card">
          <div class="big">⬆️</div>
          <div class="name">Улучшение</div>
          <div class="price">500 🥇</div>
          <button class="btn">Купить</button>
        </div>

      </div>
    `;

  }


  if(currentPage==="apiary"){

    p.innerHTML=`
      <div class="pageTitle">🌳 ТВОЯ ПАСЕКА</div>

      <div class="apiary">

        <div class="sun"></div>

        <div class="mountain m1"></div>
        <div class="mountain m2"></div>

        <div class="hive h1"></div>
        <div class="hive h2"></div>
        <div class="hive h3"></div>

        <div class="bee b1">🐝</div>
        <div class="bee b2">🐝</div>
        <div class="bee b3">🐝</div>

      </div>

      <div class="card" style="margin-top:10px">
        <div class="name">🌼 Производство пасеки</div>
        <div class="sub">
          Пчёлы работают автоматически.
          Мёд появляется каждые несколько секунд.
        </div>
      </div>
    `;

  }

  updateMoney();
}


function buyBee(){

  if(gold<100){
    alert("Недостаточно золота!");
    return;
  }

  gold-=100;

  bees.push({
    name:"Рабочая пчела",
    level:1,
    power:2
  });

  render();
}


function upgradeBee(i){

  let b=bees[i];
  let cost=b.level*50;

  if(gold<cost){
    alert("Недостаточно золота!");
    return;
  }

  gold-=cost;
  b.level++;
  b.power+=2;

  render();
}


function buyHive(){

  if(gold<300){
    alert("Нужно 300 золота!");
    return;
  }

  gold-=300;

  hives.push({
    name:"Новый улей",
    level:1,
    power:5
  });

  render();
}


function upgradeHive(i){

  let h=hives[i];
  let cost=h.level*150;

  if(gold<cost){
    alert("Недостаточно золота!");
    return;
  }

  gold-=cost;
  h.level++;
  h.power+=5;

  render();
}


function sellHoney(){

  if(honey<100){
    alert("Банка ещё не заполнена!");
    return;
  }

  honey=0;
  gold+=50;
  silver+=5;

  render();
}


/* производство */

setInterval(()=>{

  if(bees.length===0)return;

  let amount=0;

  bees.forEach(b=>{
    amount+=b.power;
  });

  hives.forEach(h=>{
    amount+=Math.floor(h.power/2);
  });

  honey=Math.min(100,honey+amount);

  updateMoney();

  if(currentPage==="honey"){
    render();
  }

},3000);


openPage("bees");

</script>

</body>
</html>
